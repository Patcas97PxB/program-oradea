<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program Oradea</title>
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Program">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Limbajul vizual din Centralizator RCA: doar temă închisă, Plus Jakarta Sans, degradeul de brand, carduri de sticlă. */
:root{
  color-scheme:dark;
  --bg:#0a0e17; --bg-deep:#070b14; --surface:#10172a; --surface-3:#1a2335; --line:#253150; --line-soft:#1c273f;
  --fg:#f1f5f9; --muted:#94a3b8;
  --predare:#22c55e; --predare-bg:rgba(34,197,94,.14);
  --preluare:#3b82f6; --preluare-bg:rgba(59,130,246,.16);
  --transfer:#f59e0b; --transfer-bg:rgba(245,158,11,.15);
  --service:#ff4d6d; --service-bg:rgba(255,77,109,.15);
  --nota:#94a3b8; --nota-bg:rgba(148,163,184,.12);
  --rfr:#ff4fff; --on-ok:#052e16;
  --brand-gradient:linear-gradient(110deg,#2563eb 0%,#7c3aed 45%,#0ea5e9 75%,#2563eb 100%);
  --card-gradient:linear-gradient(165deg,#15224a 0%,#101a36 55%,#0e1530 100%);
  --shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px -16px rgba(0,0,0,.9);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Fundalul acoperă tot ecranul, inclusiv sub bara de jos a iPhone-ului */
html{height:100%;background:var(--bg)}
html,body{margin:0}
body{min-height:100%;min-height:var(--inaltime,100dvh)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;overscroll-behavior:none;
  background-image:radial-gradient(420px 320px at 0% 0%,rgba(37,99,235,.2),transparent 70%),radial-gradient(380px 320px at 100% 100%,rgba(124,58,237,.18),transparent 70%)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button,.card,.act{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
[hidden]{display:none!important}
@keyframes newGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes btnShine{0%,55%{left:-40%}85%,100%{left:120%}}
@keyframes rfrRun{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Prinsă de marginile ecranului: pe iPhone, în aplicația instalată, 100vh/100dvh ies mai scurte cu bara de stare */
.app{position:fixed;top:0;left:0;right:0;height:var(--inaltime,100%);max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip}

/* Antet */
.top{background:rgba(7,11,20,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
  padding:calc(var(--sat) + 22px) 16px 12px;display:flex;flex-direction:column;gap:11px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.logo-po{flex:none;width:38px;height:38px;border-radius:11px;background:#10069f;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;position:relative;padding-bottom:4px}
.logo-po::after{content:"";position:absolute;bottom:8px;left:9px;right:9px;height:3px;border-radius:2px;background:linear-gradient(90deg,#00c060 0 30%,transparent 30% 35%,#147bd1 35% 65%,transparent 65% 70%,#7040c0 70%)}
.live{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0 0;color:var(--muted);font:600 12px var(--f-ui);max-width:100%;cursor:pointer}
.live span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live i{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.live.vechi i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.live.loading i{background:#60a5fa}
@media (prefers-reduced-motion:no-preference){.live i{animation:puls 2.4s ease-in-out infinite}.live.loading i{animation:puls .6s ease-in-out infinite}@keyframes puls{50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}}
.me-btn.av{width:38px;padding:0;border-radius:50%;border:0;background:var(--brand-gradient);background-size:200% 100%;color:#fff;font-size:13px}

.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.loading svg{animation:spin .9s linear infinite}
.icon-btn.bell{position:relative}
.icon-btn.bell.on{color:var(--predare);border-color:rgba(34,197,94,.5)}
.icon-btn.bell.off::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.picker-text{color:var(--muted);font-size:14px;padding:0 4px 6px;line-height:1.5}
.picker-text b{color:var(--fg)}
.me-btn{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-3);padding:0 12px;font-weight:800;font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search:focus-within{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:16px;padding:10px 0;outline:none}
.search input::placeholder{color:#64748b}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:var(--surface-3);color:var(--muted);width:26px;height:26px;border-radius:50%;font-size:17px;line-height:1;flex:none}
.days{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px}
.zi-sag{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:800 20px var(--f-ui);line-height:1;display:grid;place-items:center;padding:0 0 2px}
.zi-sag:disabled{opacity:.25}
.zi-mij{text-align:center;min-width:0}
.zi-mij small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,#2dd4bf)}
.zi-mij b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zi-tot{border:0;background:none;color:var(--muted);font:600 12px var(--f-ui);text-decoration:underline;text-underline-offset:3px;padding:2px 6px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;min-width:62px}
.day b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.day span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.day.azi span{color:#93c5fd}
.day.all{border-style:dashed;background:transparent}
.day.all b{font-size:12.5px}
.day[aria-pressed="true"]{border-color:transparent;background-image:var(--brand-gradient);background-size:250% 100%;color:#fff;box-shadow:0 8px 20px -10px rgba(124,58,237,.9)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px var(--line)}
.searching .days,.searching .seg{opacity:.35;pointer-events:none}
.banner-err{background:var(--service-bg);color:#ffb3c1;border:1px solid rgba(255,77,109,.35);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}

/* Listă */
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 12px 18px;display:flex;flex-direction:column;gap:12px}
.list>*{flex:none}
.count{font-size:11px;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
/* Cartonașul „bilet”, toate de aceeași înălțime: sus ora/tipul/rezervarea (stânga) și plăcuța (dreapta);
   linie punctată; clientul și adresa pe câte un rând; jos RFR + etichete + buton pe un singur rând */
.card{position:relative;display:flex;flex-direction:column;text-align:left;width:100%;cursor:pointer;height:186px;
  background:var(--card-gradient);border:1px solid var(--line);border-radius:16px;padding:0;
  box-shadow:var(--shadow),0 0 22px -14px var(--t);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--t);box-shadow:0 0 12px var(--t)}
.card:active{transform:scale(.99)}
.card.done{opacity:.5}
/* Varianta B · bilet subțire (aleasă 17.10): sus ora · tipul · etichete · rezervarea; jos RFR · plăcuța · clientul;
   în dreapta un singur buton (Iau eu / Finalizat) sau cine o are. Aceeași înălțime pentru toate. */
.list{gap:8px}
.card.b{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;height:74px;padding:8px 12px 8px 16px;border-radius:12px;box-shadow:var(--shadow)}
.card.b::before{top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;box-shadow:0 0 8px var(--t)}
.card.b.serv{height:auto;min-height:74px}
.b-st{min-width:0;display:flex;flex-direction:column;gap:6px}
.b-sus{display:flex;align-items:center;gap:7px;min-width:0;height:20px}
.b-ora{flex:none;font-weight:800;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.b-tip{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t)}
.b-etc{display:flex;gap:4px;min-width:0;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.b-etc .chip{font-size:9.5px;padding:2px 6px}
.b-rez{flex:none;margin-left:auto;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.b-jos{display:flex;align-items:center;gap:7px;min-width:0;height:24px;font-size:14px;font-weight:700}
.b-jos .cl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-jos .cl small{font-weight:500;font-size:12.5px;color:var(--muted)}
.b-jos .plate.mini{font-size:11.5px}
.b-jos .rfr-btn{min-height:22px;padding:2px 6px;font-size:9.5px;border-radius:5px;letter-spacing:.06em}
.b-serv{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-act{flex:none;font:800 12px var(--f-ui);border-radius:10px;padding:9px 11px;white-space:nowrap;border:1px solid var(--line);background:var(--surface-3);color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis}
button.b-act{cursor:pointer}
.b-act.ia{position:relative;background:var(--brand-gradient);background-size:200% 100%;color:#fff;border-color:transparent}
.b-act.fin{background:var(--predare);color:var(--on-ok);border-color:transparent}
.b-act.gata{background:var(--predare-bg);color:var(--predare);border-color:transparent}
.b-act.alt{background:transparent;color:#bfdbfe;border-color:#3b82f6}
.card.done::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(34,197,94,.06) 0 8px,transparent 8px 16px)}
.card.nota{cursor:default;padding:14px 16px 12px 18px;justify-content:center;gap:6px}
.card.nota .where{white-space:normal;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;margin-top:6px}
.c-head{flex:none;height:78px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:1px dashed var(--line)}
.time{flex:none;width:96px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}
.time b{font-weight:800;font-size:22px;line-height:1;letter-spacing:-.01em}
.time small{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--t)}
.time .c-rez{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.day-tag{font-size:10px;font-weight:800;color:#93c5fd;letter-spacing:.04em}
.c-plate{flex:1;min-width:0;display:flex;justify-content:center}
.c-mid{flex:none;height:56px;text-align:center;padding:9px 14px 0 18px;display:flex;flex-direction:column;gap:3px;align-items:center}
.who-line{font-size:15.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{font-size:12.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-mid .where.doua{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.where svg{width:12px;height:12px;vertical-align:-1px;margin-right:3px}
.c-serv{flex:none;height:136px;display:flex;align-items:flex-start;gap:10px;padding:14px 14px 0 18px;border-bottom:1px dashed var(--line)}
.c-task{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.plate.mini{font-size:12px;vertical-align:1px;border-width:1px;border-radius:4px;margin:0 1px}
.plate.mini i{font-size:6.5px;padding:0 2px 2px}
.plate.mini b{padding:2px 5px 2px}
.sheet-plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.task-mare{font-size:17px;font-weight:600;line-height:1.6}
.c-foot{flex:none;margin-top:auto;height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 4px 18px}
.c-foot .chips{flex-wrap:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap;border:1px solid var(--line-soft)}
.chip.rfr-no{background:var(--transfer-bg);color:var(--transfer);border-color:transparent}
.chip.pay{background:var(--service-bg);color:var(--service);border-color:transparent}
.chip.rca{background:rgba(192,132,252,.16);color:#d8b4fe;border-color:rgba(192,132,252,.45)}
.chip.me{background:rgba(37,99,235,.22);color:#bfdbfe;border-color:rgba(96,165,250,.5)}
.chip.st{background:var(--predare-bg);color:var(--predare);border-color:transparent}
.chip.free{border:1px dashed var(--muted);background:transparent}
.plate{display:inline-flex;align-items:stretch;flex:none;white-space:nowrap;border:1.5px solid #0b0b0b;border-radius:6px;background:#fff;color:#0b0b0b;
  font-weight:800;font-size:17px;line-height:1;letter-spacing:.06em;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.plate i{font-style:normal;background:#1b3fa6;color:#fff;font-size:8.5px;font-weight:700;letter-spacing:0;display:flex;align-items:flex-end;padding:0 3px 3px}
.plate b{font-weight:800;padding:6px 9px 5px}
.plate.big{font-size:26px;border-radius:8px}
.plate.big i{font-size:11px;padding:0 5px 4px}
/* plăcuța europeană: bandă albastră cu cercul de stele, fără codul țării */
.plate i,.pl i{width:1.05em;padding:0!important;font-size:inherit!important;background:#003399 url("data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 20 20%22 fill%3D%22%23ffcc00%22%3E%3Cpolygon points%3D%2216.00,8.55 16.36,9.51 17.38,9.55 16.58,10.19 16.85,11.17 16.00,10.61 15.15,11.17 15.42,10.19 14.62,9.55 15.64,9.51%22%2F%3E%3Cpolygon points%3D%2215.20,11.55 15.55,12.51 16.58,12.55 15.78,13.19 16.05,14.17 15.20,13.61 14.34,14.17 14.62,13.19 13.82,12.55 14.84,12.51%22%2F%3E%3Cpolygon points%3D%2213.00,13.75 13.36,14.70 14.38,14.75 13.58,15.38 13.85,16.37 13.00,15.81 12.15,16.37 12.42,15.38 11.62,14.75 12.64,14.70%22%2F%3E%3Cpolygon points%3D%2210.00,14.55 10.36,15.51 11.38,15.55 10.58,16.19 10.85,17.17 10.00,16.61 9.15,17.17 9.42,16.19 8.62,15.55 9.64,15.51%22%2F%3E%3Cpolygon points%3D%227.00,13.75 7.36,14.70 8.38,14.75 7.58,15.38 7.85,16.37 7.00,15.81 6.15,16.37 6.42,15.38 5.62,14.75 6.64,14.70%22%2F%3E%3Cpolygon points%3D%224.80,11.55 5.16,12.51 6.18,12.55 5.38,13.19 5.66,14.17 4.80,13.61 3.95,14.17 4.22,13.19 3.42,12.55 4.45,12.51%22%2F%3E%3Cpolygon points%3D%224.00,8.55 4.36,9.51 5.38,9.55 4.58,10.19 4.85,11.17 4.00,10.61 3.15,11.17 3.42,10.19 2.62,9.55 3.64,9.51%22%2F%3E%3Cpolygon points%3D%224.80,5.55 5.16,6.51 6.18,6.55 5.38,7.19 5.66,8.17 4.80,7.61 3.95,8.17 4.22,7.19 3.42,6.55 4.45,6.51%22%2F%3E%3Cpolygon points%3D%227.00,3.35 7.36,4.31 8.38,4.36 7.58,4.99 7.85,5.98 7.00,5.41 6.15,5.98 6.42,4.99 5.62,4.36 6.64,4.31%22%2F%3E%3Cpolygon points%3D%2210.00,2.55 10.36,3.51 11.38,3.55 10.58,4.19 10.85,5.17 10.00,4.61 9.15,5.17 9.42,4.19 8.62,3.55 9.64,3.51%22%2F%3E%3Cpolygon points%3D%2213.00,3.35 13.36,4.31 14.38,4.36 13.58,4.99 13.85,5.98 13.00,5.41 12.15,5.98 12.42,4.99 11.62,4.36 12.64,4.31%22%2F%3E%3Cpolygon points%3D%2215.20,5.55 15.55,6.51 16.58,6.55 15.78,7.19 16.05,8.17 15.20,7.61 14.34,8.17 14.62,7.19 13.82,6.55 14.84,6.51%22%2F%3E%3C%2Fsvg%3E") center 42%/0.82em no-repeat}
.plate.big b{padding:8px 12px 7px}
.plate.none{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);font-weight:700}
.plate.none b{padding:6px 10px}
.rfr-btn{flex:none;border:1px solid #3a4560;background:#000;color:#fff;border-radius:8px;min-height:30px;
  padding:6px 11px;font-weight:800;font-size:11px;letter-spacing:.08em}
.rfr-btn[aria-pressed="true"]{background:var(--rfr);border-color:var(--rfr);color:#2a0030;box-shadow:0 0 14px -2px rgba(255,79,255,.8)}
.card-take{position:relative;overflow:hidden;flex:none;min-height:38px;white-space:nowrap;border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;color:#fff;
  background-image:var(--brand-gradient);background-size:250% 100%;animation:newGrad 14s ease-in-out infinite;box-shadow:0 10px 26px -12px rgba(124,58,237,.9),0 0 0 1px rgba(0,0,0,.4)}
.card-take::after,.take::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);animation:btnShine 6s ease-in-out infinite}
.card-take.join{background:transparent;animation:none;color:#bfdbfe;box-shadow:inset 0 0 0 1.5px #3b82f6}
.card-take.finish{background:var(--predare);animation:none;color:var(--on-ok);box-shadow:0 8px 20px -10px rgba(34,197,94,.9)}
.card-take.join::after,.card-take.finish::after{display:none}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.subsol{flex:none;text-align:center;font-size:9.5px;letter-spacing:.02em;color:var(--muted);opacity:.38;padding:5px 12px calc(var(--sab) + 5px);background:var(--bg);border-top:1px solid var(--line-soft)}
.credit{flex:none;text-align:center;color:var(--muted);opacity:.65;font-size:11.5px;line-height:1.5;padding:18px 12px 6px;margin:0}
.info-date{max-height:60vh;overflow-y:auto;font-size:13.5px;line-height:1.55;color:var(--muted);padding:0 4px}
.info-date h4{color:#fff;font-size:13.5px;margin:12px 0 3px}
.info-date p{margin:0}

/* Detalii */
.sheet{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
/* Detalii (ales 17.10): antet 3D · listă cu iconițe · bară de acțiuni jos */
.d-cap{position:relative;overflow:hidden;color:#fff;padding:calc(var(--sat) + 22px) 16px 20px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,var(--t) -40%,var(--t-bg) 55%,var(--bg) 100%)}
.d-cap .back{color:rgba(255,255,255,.85);position:relative;z-index:1}
.d-fil{position:absolute;right:-8px;top:calc(var(--sat) + 30px);font-size:62px;font-weight:800;letter-spacing:-.03em;color:rgba(255,255,255,.07);pointer-events:none;text-transform:uppercase;white-space:nowrap}
.d-tip{position:relative;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.d-r{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.d-ora{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.d-cl{font-size:19px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.d-rfr{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font:800 12.5px var(--f-ui);letter-spacing:.04em;border-radius:999px;padding:7px 12px;border:1.5px solid #f59e0b;color:#f59e0b;background:rgba(7,11,20,.45)}
.d-rfr::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d-rfr[aria-pressed="true"]{background:var(--rfr);border-color:var(--rfr);color:#fff}
.d-lista{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
.d-li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-soft)}
.d-li:last-child{border-bottom:0}
.d-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;color:#2dd4bf}
.d-ic svg{width:17px;height:17px}
.d-li small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.d-li b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.d-mini{border:1px solid var(--line);background:var(--surface-3);color:var(--fg);font:800 12.5px var(--f-ui);border-radius:10px;padding:8px 11px;white-space:nowrap}
.d-mini[aria-pressed="true"]{background:rgba(37,99,235,.25);border-color:#3b82f6;color:#dbeafe}
.d-plata{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#ffb3c1;background:var(--service-bg);border:1px solid rgba(255,77,109,.35);border-radius:12px;padding:10px 12px}
.d-bara{flex:none;border-top:1px solid var(--line-soft);background:rgba(7,11,20,.94);padding:10px 14px calc(var(--sab) + 12px);display:flex;gap:10px;align-items:center}
.d-rot{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--surface-3);display:grid;place-items:center;color:var(--fg);flex:none;text-decoration:none}
.d-rot svg{width:20px;height:20px}
.d-rot.sun{background:var(--predare);border-color:var(--predare);color:var(--on-ok)}
.d-rot[aria-disabled="true"]{opacity:.35;pointer-events:none}
.d-main{flex:1;min-height:50px;border:0;border-radius:14px;font:800 15px var(--f-ui);color:#fff;background:var(--brand-gradient);background-size:200% 100%}
.d-main.ok{background:var(--predare);color:var(--on-ok)}
.d-main.sec{background:var(--surface-3);color:var(--fg);border:1px solid var(--line)}
.d-main:disabled{opacity:.6}
.sheet-head{background:linear-gradient(180deg,var(--t-bg),transparent),var(--bg-deep);padding:calc(var(--sat) + 22px) 16px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line-soft)}
.back{align-self:flex-start;border:0;background:transparent;font-weight:700;color:var(--muted);padding:6px 0;font-size:15px}
.type-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
.type-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.big-time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 22px);display:flex;flex-direction:column;gap:12px}
.sheet-body>*{flex:none}
.box{background:var(--card-gradient);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.alert{background:var(--service-bg);color:#ffb3c1;border:1px solid rgba(255,77,109,.35);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px}
.rfr-band{overflow:hidden;border-radius:10px;border:2px solid #111;background:#ffd21f;color:#111;box-shadow:0 0 22px -6px rgba(255,210,31,.6)}
.rfr-track{display:flex;width:max-content;animation:rfrRun 12s linear infinite}
.rfr-track span{flex:none;padding:9px 18px;font-weight:800;font-size:14px;letter-spacing:.08em;white-space:nowrap;border-right:2px dashed rgba(17,17,17,.35)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:800;
  background:var(--surface-3);border:1px solid var(--line);color:var(--fg);font-size:14.5px;text-align:center}
.act.call{background:var(--predare);border-color:var(--predare);color:var(--on-ok);box-shadow:0 10px 24px -12px rgba(34,197,94,.9)}
.act[aria-disabled="true"]{opacity:.4;pointer-events:none}
.act svg{width:18px;height:18px;flex:none}
.owner{font-size:14px;color:var(--muted)}
.owner b{color:var(--fg)}
.take{position:relative;overflow:hidden;width:100%;min-height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1.2;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;color:#fff;
  background-image:var(--brand-gradient);background-size:250% 100%;animation:newGrad 14s ease-in-out infinite;box-shadow:0 10px 26px -12px rgba(124,58,237,.9)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.step{border:1px solid var(--line);background:var(--surface-3);border-radius:12px;padding:11px 4px;font-weight:800;font-size:13.5px;text-align:center}
.step[aria-pressed="true"]{background:rgba(37,99,235,.25);border-color:#3b82f6;color:#dbeafe}
.step small{display:block;font-weight:600;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.link-btn{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;align-self:center;padding:4px}
.raw{font-size:12px;color:var(--muted);background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.raw .rfr-on{color:var(--rfr);font-weight:700}
.pax{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pax li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.pax li:first-child{border-top:0;padding-top:2px}
.pax b{display:block;font-size:14px}
.pax small,.picker-row small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pax-call{flex:none;text-decoration:none;font-weight:800;font-size:13px;color:var(--on-ok);background:var(--predare);border-radius:10px;padding:8px 12px}

/* Alegerea numărului, mesaje */
.picker{position:absolute;inset:0;z-index:45;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end}
.picker-card{width:100%;background:#10172a;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 14px calc(var(--sab) + 16px);
  display:flex;flex-direction:column;gap:8px;max-height:85%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.picker-card>*{flex:none;flex-shrink:0}
.picker-row,.cont-row{min-height:48px} /* într-o listă lungă nimic nu se turtește; se derulează */
.picker-title{font-weight:800;font-size:16px;padding:0 4px 4px}
.picker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--fg);
  background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;text-align:left;width:100%}
.picker-row b{display:block;font-size:14.5px}
.picker-row i{font-style:normal;font-weight:800;font-size:13px;color:var(--on-ok);background:var(--predare);border-radius:9px;padding:6px 11px}
.picker-row[aria-pressed="true"]{border-color:#3b82f6;background:rgba(37,99,235,.2)}
.picker-cancel{margin-top:4px;border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 22px);z-index:30;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#232d45;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:700;font-size:13.5px;
  width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{margin-left:12px;border:0;background:transparent;color:#93c5fd;font-weight:800;text-decoration:underline;padding:0}

/* Prima pornire */
.setup{position:absolute;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(var(--sat) + 40px) 22px calc(var(--sab) + 30px);display:flex;flex-direction:column;gap:18px}
.setup img{width:76px;height:76px;border-radius:20px;box-shadow:0 12px 30px -12px rgba(16,6,159,.9)}
.setup h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.setup p{margin:0;color:var(--muted)}
.setup label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.setup input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px;color:var(--fg);width:100%}
#fCod{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.15em}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.people button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 4px;font-weight:800}
.people button[aria-pressed="true"]{border-color:transparent;background-image:var(--brand-gradient);background-size:250% 100%;color:#fff}
.setup .err{color:#ffb3c1;font-weight:700;font-size:13.5px}
.setup-form{display:flex;flex-direction:column;gap:14px}
.picker-card input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px;color:var(--fg);width:100%}
.picker-card label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--muted);padding:0 4px}
.cont-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line-soft)}
.cont-row b{display:block;font-size:14.5px}
.cont-row small{display:block;color:var(--muted);font-size:12.5px}
.cont-row button{flex:none;border:1px solid var(--line);background:var(--surface-3);border-radius:10px;padding:8px 11px;font-weight:800;font-size:12.5px}
.cod-mare{font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:var(--bg-deep);border:1px dashed #3b82f6;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}.rfr-track,.take,.card-take,.take::after,.card-take::after,.icon-btn.loading svg{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <span class="logo-po" aria-hidden="true">PO</span>
      <div class="brand">Program Oradea<button class="live" id="refresh" type="button" aria-label="Actualizează programul"><i></i><span id="subtitle">Se încarcă…</span></button></div>
      <div class="top-actions">
        <button class="icon-btn bell" id="bell" type="button" aria-label="Notificări" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        </button>
        <button class="me-btn av" id="meBtn" type="button" aria-label="Contul meu"></button>
      </div>
    </div>
    <div class="banner-err" id="err" hidden></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Caută: nr. auto, nume, RZO, telefon…" autocomplete="off" aria-label="Caută intervenții">
      <button id="qClear" type="button" aria-label="Șterge căutarea" hidden>×</button>
    </div>
    <div class="days" id="days" role="group" aria-label="Ziua"></div>
    <div class="seg" role="group" aria-label="Filtru">
      <button data-f="mine" type="button" aria-pressed="true">Ale mele</button>
      <button data-f="free" type="button" aria-pressed="false">Libere</button>
      <button data-f="all" type="button" aria-pressed="false">Toate</button>
    </div>
  </header>

  <main class="list" id="list"></main>
  <div class="subsol" id="subsol"></div>
  <section class="sheet" id="sheet" aria-label="Detalii intervenție"></section>
  <div class="picker" id="picker" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <section class="setup" id="setup" hidden>
    <img src="icons/icon-192.png" alt="">
    <h1>Program Oradea</h1>
    <p id="setupText"></p>
    <div class="seg" id="setupMod" role="group" aria-label="Cum intri" style="grid-template-columns:1fr 1fr">
      <button type="button" data-m="login" aria-pressed="true">Intră în cont</button>
      <button type="button" data-m="activare" aria-pressed="false">Am un cod de activare</button>
    </div>
    <form id="setupForm" class="setup-form" novalidate>
      <label id="lblCod" hidden>Cod de activare
        <input id="fCod" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ex. K7M2QX">
      </label>
      <label>Utilizator
        <input id="fUser" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="ex. filip">
      </label>

        <input id="fParola" type="password" autocomplete="current-password">
      </label>

        <input id="fParola2" type="password" autocomplete="new-password">

    <p class="credit">Datele clienților sunt doar pentru uz intern, în interes de serviciu. <a href="#" id="linkDate" style="color:inherit">Date și confidențialitate</a><br>© 2026 Bogdan Pătcaș · Toate drepturile rezervate</p>
  </section>
</div>

<script>

};

// Colegii vin de la script (lista editată de administrator). Asta e doar rezerva până la prima încărcare.
const COLEGI_REZERVA=[["ANGEL","Angel"],["BOGDAN","Bogdan"],["FILIP","Filip"],["GEORGE","George"],["IULIAN","Iulian"],["RARES","Rareș"],["SEBI","Sebi"],["URSU","Ursu"],["VLAD","Vlad"]];
const colegi=()=>(state.data&&state.data.colegi)?state.data.colegi.map(c=>[c.cod,c.nume]):COLEGI_REZERVA;
const TYPES={
  predare:{label:"Predare",c:"var(--predare)",bg:"var(--predare-bg)"},
  preluare:{label:"Preluare",c:"var(--preluare)",bg:"var(--preluare-bg)"},
  transfer:{label:"Transfer",c:"var(--transfer)",bg:"var(--transfer-bg)"},
  service:{label:"Service",c:"var(--service)",bg:"var(--service-bg)"},

};
const ZILE_SAPT=["Dum","Lun","Mar","Mie","Joi","Vin","Sâm"];

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const state={
  token:store.get("po.token",""), me:store.get("po.me",""), rol:store.get("po.rol",""), user:store.get("po.user",""), filter:store.get("po.filter","mine"), day:null, q:"",

};
["po.assign","po.prog","po.rfr"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}}); // statusurile vechi, doar locale

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const isoAzi=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};

// Numărul afișat ca pe plăcuță: „B 955 ATN”, „BH 52 LCA” (pe un singur rând, cu banda RO)
const formatNr=p=>{const m=/^([A-Z]{1,2})(\d{2,3})([A-Z]{3})$/.exec(p||"");return m?m[1]+" "+m[2]+" "+m[3]:(p||"");};
const plate=(p,big)=>p?`<span class="plate${big?" big":""}"><i></i><b>${esc(formatNr(p))}</b></span>`:`<span class="plate none${big?" big":""}"><b>fără nr.</b></span>`;
const compact=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[\s.\-\/()+,]/g,"");
const numeAfisat=cod=>(colegi().find(p=>p[0]===cod)||[cod,cod])[1];

// ---------- Datele ----------
let ITEMS=[], DAYS=[];
function pregateste(){
  ITEMS=[];DAYS=[];
  if(!state.data||!state.data.zile) return;
  state.data.zile.forEach(z=>{
    const d=new Date(z.data+"T12:00:00");
    const zi={id:z.data,dow:ZILE_SAPT[d.getDay()],lung:ZILE_LUNG[d.getDay()],d:pad(d.getDate())+"."+pad(d.getMonth()+1),items:[]};
    const vazute={};
    z.interventii.forEach(r=>{
      // ID-ul vine de la script și rămâne același când se schimbă ora sau mașina (zi|tip|rezervare),
      // ca statusurile (Finalizat, RFR, Iau eu) să nu se piardă. Rezerva e pentru date vechi, fără id.
      let id=r.id||[z.data,r.ora||"",r.nrAuto||"",r.rezervare||"",r.tip].join("|");
      if(!r.id){vazute[id]=(vazute[id]||0)+1; if(vazute[id]>1) id+="#"+vazute[id];}
      const it={
        id, r, dayId:z.data, dayD:zi.d, type:TYPES[r.tip]?r.tip:"service",
        t:r.ora?(r.oraPana?r.ora+"–"+r.oraPana:r.ora):(r.oraNesigura?"??:??":""),
        plate:r.nrAuto, client:r.client, company:r.firma,
        contacts:(r.contacte||[]).map(c=>({n:c.nume,t:c.tel,a:c.afisat})),
        info:[r.clasa?"Clasa "+r.clasa:null,r.implicate?"VI "+r.implicate.join(", "):null].filter(Boolean).join(" · ")||null,
        loc:r.loc, from:r.de_la, to:r.pana_la, map:r.harta||[], flight:r.zbor, res:r.rezervare,
        pay:r.plata, paid:r.platit, notes:r.note||[], who:r.colegi||[], ok:!!r.ok, urgent:!!r.urgent, raw:r.raw
      };
      it.hay=compact([it.raw,it.client,it.company,it.from,it.to,(it.contacts||[]).map(c=>c.n+" "+c.t).join(" ")].join(" "));
      zi.items.push(it);ITEMS.push(it);
    });
    DAYS.push(zi);
  });
  if(!state.day||!DAYS.some(d=>d.id===state.day)){
    const azi=isoAzi();
    state.day=(DAYS.find(d=>d.id===azi)||DAYS.find(d=>d.id>azi)||DAYS[DAYS.length-1]||{}).id||null;
  }
}

// gen crește la fiecare apăsare: un răspuns pornit ÎNAINTE de apăsare e vechi și nu are voie să o suprascrie.
let gen=0,dinNou=false;
async function incarca(manual,faraMesaj){
  if(!state.token) return;
  if(state.loading){dinNou=true;return;}     // vine imediat după cererea în curs
  if(!manual&&inZbor>0) return;              // o apăsare încă se salvează; după ea se cere oricum
  state.loading=true;if(manual&&!faraMesaj)$("#refresh").classList.add("loading");
  const g=gen, tot=vreauTot();
  try{
    // v = versiunea pe care o avem: dacă nu s-a schimbat nimic, scriptul răspunde doar „neschimbat”
    const v=state.data&&state.data.v&&(!!state.data.doarAziMaine===!tot)?"&v="+encodeURIComponent(state.data.v):"";
    const r=await fetch(SCRIPT_URL+"?t="+encodeURIComponent(state.token)+(tot?"":"&z=2")+v,{cache:"no-store"});
    const j=await r.json();
    if(j.eroare){
      if(j.auth){ arataLogin(j.eroare); return; }
      throw new Error(j.eroare);
    }
    if(g!==gen||inZbor>0){dinNou=true;return;} // între timp ai apăsat ceva: răspunsul e de dinainte
    state.sync=Date.now();store.set("po.sync",state.sync);
    if(j.neschimbat){$("#err").hidden=true;if(manual&&!faraMesaj)toast("Program actualizat");return;}
    state.data=j;store.set("po.data",j);
    state.sync=Date.now();store.set("po.sync",state.sync);
    $("#err").hidden=true;
    pregateste();renderDays();render();
    // cardul deschis (ex. din notificare, cu datele vechi din telefon) se redesenează cu programul nou
    {const sh=$("#sheet");if(sh.classList.contains("open")&&sh.dataset.id)openDetail(sh.dataset.id);}
    deschideDinLink();
    if(manual&&!faraMesaj) toast("Program actualizat");
  }catch(e){
    $("#err").hidden=false;
    $("#err").textContent=state.data?"Fără legătură cu programul. Afișez ultima variantă primită.":"Nu pot încărca programul. Verifică semnalul și apasă ⟳.";
  }finally{
    state.loading=false;$("#refresh").classList.remove("loading");subtitlu();
    if(dinNou){dinNou=false;setTimeout(()=>incarca(true,true),0);}
  }
}

function initiale(cod){const n=(numeAfisat(cod)||"Eu").trim();return n.slice(0,2).toUpperCase();}
function subtitlu(){
  if(!state.data){$("#subtitle").textContent=state.loading?"Se încarcă…":"Fără date";return;}
  const s=state.sync||store.get("po.sync",0);
  const min=s?Math.round((Date.now()-s)/60000):null;
  const dm=state.data.documentModificat?new Date(state.data.documentModificat):null;
  const ora=dm?" · program "+pad(dm.getHours())+":"+pad(dm.getMinutes()):"";
  $("#subtitle").textContent=(min===null?"ultima variantă salvată":min<1?"la zi":"acum "+min+" min")+ora;
  $("#refresh").classList.toggle("vechi",min===null||min>=2);
}

// ---------- Statusuri (comune pentru toți colegii, ținute de script; documentul nu se modifică) ----------
// Pentru fiecare intervenție: plus/minus = colegi adăugați/scoși față de program, pornit, finalizat, rfr.
const statusuri=()=>(state.data&&state.data.statusuri)||{};
const stOf=it=>(statusuri()[it.dayId]||{})[it.id]||null;
function who(it){
  const s=stOf(it); if(!s) return it.who;
  const w=it.who.filter(x=>!(s.minus||[]).includes(x));
  (s.plus||[]).forEach(x=>{if(!w.includes(x)&&!(s.minus||[]).includes(x))w.push(x);});
  return w;
}
function prog(it){const s=stOf(it)||{};return {started:s.pornit&&s.pornit.ora,startedBy:s.pornit&&s.pornit.cine,done:s.finalizat&&s.finalizat.ora,doneBy:s.finalizat&&s.finalizat.cine};}
// Când aplicația scrie în program (Google Docs, „scriere” de la script), documentul e sursa de adevăr pentru
// Finalizat și RFR — inclusiv față de statusuri vechi. Altfel (.docx, doar citire) contează statusul din aplicație.
const docSursa=()=>!!(state.data&&state.data.scriere);
const isDone=it=>{const s=stOf(it);return it.ok||!!(s&&s.finalizat&&!s.finalizat.doc&&!docSursa());};
const rfrOk=it=>{const s=stOf(it);return s&&s.rfr&&!s.rfr.doc&&!docSursa()?s.rfr.facut:it.r.rfr==="facut";};

let TAIL=/(?!)/,tailPentru=null;
function tail(){ // expresia pentru numele colegilor de la finalul rândului, refăcută când se schimbă lista
  const lista=state.data&&state.data.colegi;
  if(lista&&lista!==tailPentru){
    tailPentru=lista;
    const alt=lista.flatMap(c=>c.aliasuri||[]).sort((a,b)=>b.length-a.length).map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s*")).join("|");
    if(alt) TAIL=new RegExp("(?:\\s*[\\/+]?\\s*(?:"+alt+")\\.?)+\\s*(?:OK!?)?\\s*$","i");
  }
  return TAIL;
}
function docLine(it){
  let h=esc(it.raw);
  if(it.type==="predare"&&/RFR/.test(h)) h=h.replace("RFR",`<span class="${it.r.rfr==="facut"?"rfr-on":""}">RFR</span>`);
  return h;
}

// Pe cartonaș etichetele stau pe un singur rând, deci cele importante primele; plata e scurtată (întreagă în detalii)
function plataScurta(t){
  const x=String(t||"").toLowerCase(),r=[];
  if(/achitat|pl[aă]tit/.test(x)) r.push("Plătit");
  if(/inc[aă]s|încas/.test(x)) r.push("De încasat");
  if(/debit/.test(x)) r.push("De debitat");
  if(/garan/.test(x)) r.push("+ garanție");
  return r.join(" ")||t;
}
function chips(it){
  const c=[],w=who(it),p=prog(it);
  if(isDone(it)) c.push(`<span class="chip st">✓ Finalizat${p.done?" "+p.done:""}</span>`);
  else if(p.started) c.push(`<span class="chip st">Pornit ${esc(p.started)}${p.startedBy&&p.startedBy!==state.me?" · "+esc(numeAfisat(p.startedBy)):""}</span>`);
  if(it.urgent) c.push(`<span class="chip pay">Urgent</span>`);
  (it.r.numeNecunoscute||[]).forEach(n=>c.push(`<span class="chip pay" title="Nume care nu e în lista de agenți">? ${esc(n.text)}${n.sugestie?" → "+esc(numeAfisat(n.sugestie)):""}</span>`));
  // „Lipsă RFR” nu mai apare pe cartonaș: butonul RFR negru spune deja asta (în detalii rămâne banda galbenă)
  if(it.r.rca) c.push(`<span class="chip rca">RCA${it.r.rca.asigurator?" · "+esc(it.r.rca.asigurator):""}</span>`);
  if(!w.length) c.push(`<span class="chip free">Liberă</span>`);
  else c.push(...w.map(x=>`<span class="chip${x===state.me?" me":""}">${esc(numeAfisat(x))}</span>`));
  if(it.pay) c.push(`<span class="chip${it.paid?"":" pay"}">${esc(plataScurta(it.pay))}</span>`);
  return c.join("");
}
const RE_PLACUTA=/\b(?:B\s?\d{2,3}|[A-Z]{2}\s?\d{2})\s?[A-Z]{3}\b|\b[A-Z]{4}\d{3}\b|\b[A-Z]{3}-\d{3}\b/g;
const placutaMica=p=>`<span class="plate mini"><i></i><b>${esc(formatNr(p.replace(/[\s-]/g,"")))}</b></span>`;
// „DE DUS LA PRO TYRES B384AUT” → „De dus la pro tyres [B 384 AUT]”: majusculele devin text normal, mașinile rămân plăcuțe
function textSarcina(it){
  let t=it.raw.replace(/^\s*[\d:?.\-–!]+\s*[-,]?\s*/,"").replace(tail(),"").replace(/^[\s\-–,]+|[\s\-–,]+$/g,"");
  const litere=t.replace(/[^A-Za-zĂÂÎȘȚăâîșț]/g,""),mari=litere.replace(/[^A-ZĂÂÎȘȚ]/g,"").length;
  const strigat=litere.length>6&&mari/litere.length>0.7;
  let html="",ultim=0,m,primul=true;
  RE_PLACUTA.lastIndex=0;
  const bucata=x=>{let y=strigat?x.toLowerCase():x;if(primul&&y.trim()){y=y.replace(/^\s*[-–]\s*/," – ").replace(/^([\s–]*)([^\s–])/,(a,sp,c)=>sp+c.toUpperCase());primul=false;}return esc(y);};
  while((m=RE_PLACUTA.exec(t))){html+=bucata(t.slice(ultim,m.index))+placutaMica(m[0]);ultim=m.index+m[0].length;}
  return html+bucata(t.slice(ultim));
}
function line2(it){
  if(it.type==="transfer") return [it.from,it.to].filter(Boolean).join(" → ")||it.raw;
  if(it.type==="service"||it.type==="nota") return it.raw.replace(/^\s*[\d:?.\-–!]+\s*[-,]?\s*/,"").replace(tail(),"");
  return [it.company,it.loc].filter(Boolean).join(" · ");
}

// De obicei se încarcă doar azi și mâine (rapid). Tot programul doar la cerere: „Toate zilele” sau căutare, 10 minute.
const vreauTot=()=>Date.now()<(state.totPana||0);
function cereTot(){const era=vreauTot();state.totPana=Date.now()+10*60000;if(!era||(state.data&&state.data.doarAziMaine))incarca(true);}
const LUNI=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
function renderDays(){
  const azi=isoAzi(),m=new Date();m.setDate(m.getDate()+1);
  const maine=m.getFullYear()+"-"+pad(m.getMonth()+1)+"-"+pad(m.getDate());
  const i=DAYS.findIndex(d=>d.id===state.day),d=DAYS[i];
  if(!d){$("#days").innerHTML="";return;}
  const prev=DAYS[i-1],next=DAYS[i+1],dt=new Date(d.id+"T12:00:00");
  const eticheta=d.id===azi?"Azi":d.id===maine?"Mâine":d.id<azi?"Trecută":"";
  // ultima zi încărcată, dar programul are mai multe: săgeata cere tot programul
  const maiMulte=!next&&state.data&&state.data.doarAziMaine;
  const link=state.data&&state.data.doarAziMaine?`<button class="zi-tot" type="button" data-all="1">vezi toate zilele</button>`
    :d.id!==azi&&DAYS.some(x=>x.id===azi)?`<button class="zi-tot" type="button" data-id="${azi}">înapoi la azi</button>`:"";
  $("#days").innerHTML=`<button class="zi-sag" type="button" aria-label="Ziua dinainte" ${prev?`data-id="${prev.id}"`:"disabled"}>‹</button>
    <div class="zi-mij"><small>${eticheta||"&nbsp;"}</small><b>${d.lung}, ${dt.getDate()} ${LUNI[dt.getMonth()]}</b>${link}</div>
    <button class="zi-sag" type="button" aria-label="Ziua următoare" ${next?`data-id="${next.id}"`:maiMulte?'data-all="1"':"disabled"}>›</button>`;
}


function card(it,searching){
  const T=TYPES[it.type];
  if(it.type==="nota") return `<div class="card nota" style="--t:${T.c}"><div class="body">
      <div class="time">${searching?`<span class="day-tag">${esc(it.dayD)}</span>`:""}<small>Notă${it.t?" · "+esc(it.t):""}</small></div>
      <div class="where">${esc(it.raw)}</div></div></div>`;
  const w=who(it),mine=w.includes(state.me),done=isDone(it),p=prog(it);
  // butonul din dreapta: liberă → Iau eu; a mea → Finalizat; a altora → cine o are (detaliile au „Mă adaug și eu”); gata → ✓
  const act=done?`<span class="b-act gata">✓ Gata</span>`
    :mine?`<button class="b-act fin" type="button" data-finish="${it.id}">✓ Finalizat</button>`
    :w.length?`<span class="b-act alt">${esc(w.map(numeAfisat).join(" + "))}</span>`
    :`<button class="b-act ia" type="button" data-take="${it.id}">Iau eu</button>`;
  // etichete mici pe rândul de sus: stare, urgent, nume greșite, RCA, plata, colegii de lângă mine
  const e=[];
  if(!done&&p.started) e.push(`<span class="chip st">Pornit ${esc(p.started)}</span>`);
  if(it.urgent) e.push(`<span class="chip pay">Urgent</span>`);
  (it.r.numeNecunoscute||[]).forEach(n=>e.push(`<span class="chip pay">? ${esc(n.text)}</span>`));
  if(it.r.rca) e.push(`<span class="chip rca">RCA${it.r.rca.asigurator?" · "+esc(it.r.rca.asigurator):""}</span>`);
  if(it.pay) e.push(`<span class="chip${it.paid?"":" pay"}">${esc(plataScurta(it.pay))}</span>`);
  if(mine&&w.length>1) e.push(`<span class="chip me">Tu + ${esc(w.filter(x=>x!==state.me).map(numeAfisat).join(" + "))}</span>`);
  if(done&&!mine&&w.length) e.push(`<span class="chip">${esc(w.map(numeAfisat).join(" + "))}</span>`);
  const sus=`<div class="b-sus">${searching?`<span class="day-tag">${esc(it.dayD)}</span>`:""}<b class="b-ora">${esc(it.t||"––:––")}</b><span class="b-tip">${T.label}</span><span class="b-etc">${e.join("")}</span>${it.res?`<span class="b-rez">${esc(it.res)}</span>`:""}</div>`;
  if(it.type==="service") return `<div class="card b serv${done?" done":""}" role="button" tabindex="0" data-id="${it.id}" style="--t:${T.c}">
    <div class="b-st">${sus}<div class="b-serv">${textSarcina(it)}</div></div>${act}</div>`;
  const rfr=it.type==="predare"?`<button class="rfr-btn" type="button" data-rfr="${it.id}" aria-pressed="${rfrOk(it)}">RFR</button>`:"";
  const unde=line2(it);
  return `<div class="card b${done?" done":""}" role="button" tabindex="0" data-id="${it.id}" style="--t:${T.c}">
    <div class="b-st">${sus}
      <div class="b-jos">${rfr}${it.plate?placutaMica(it.plate):""}<span class="cl">${esc(it.client||unde||it.raw)}${it.client&&unde?` <small>· ${esc(unde)}</small>`:""}</span></div>
    </div>${act}</div>`;
}


function render(){
  const q=state.q.trim(),searching=q.length>0;
  $("#app").classList.toggle("searching",searching);
  subtitlu();
  if(!DAYS.length){$("#list").innerHTML=`<div class="empty">${state.loading?"Se încarcă programul…":"Programul nu are zile de afișat."}</div>`;return;}
  const d=DAYS.find(x=>x.id===state.day)||DAYS[0];
  let items;
  if(searching){
    const toks=q.split(/\s+/).map(compact).filter(Boolean);
    items=ITEMS.filter(it=>toks.every(t=>it.hay.includes(t)||compact(who(it).join(" ")).includes(t)));
  }else{
    items=d.items.slice();
    if(state.filter==="mine") items=items.filter(it=>who(it).includes(state.me));
    if(state.filter==="free") items=items.filter(it=>it.type!=="nota"&&!who(it).length&&!isDone(it));
  }
  items.sort((a,b)=>a.dayId!==b.dayId?(a.dayId<b.dayId?-1:1):((a.t||"99")<(b.t||"99")?-1:(a.t||"99")>(b.t||"99")?1:0));
  const todo=items.filter(it=>it.type!=="nota"&&!isDone(it)).length;
  const head=searching?`${items.length} rezultat${items.length===1?"":"e"} pentru „${esc(q)}”`:`${d.lung} ${d.d} · ${items.length} intervenții · ${todo} de făcut`;
  const empty=searching?`Nimic găsit pentru „${esc(q)}”.`
    :{mine:`Nicio intervenție pentru ${esc(numeAfisat(state.me))} în ${d.d}.<br>Vezi „Libere” ca să-ți iei una.`,
      free:`Toate intervențiile din ${d.d} au pe cineva.`,all:`Nicio intervenție în ${d.d}.`}[state.filter];
  $("#list").innerHTML=items.length?`<div class="count">${head}</div>`+items.map(it=>card(it,searching)).join(""):`<div class="count">${head}</div><div class="empty">${empty}</div>`;
}

function openDetail(id,synced){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const T=TYPES[it.type], w=who(it), p=prog(it), mine=w.includes(state.me), done=isDone(it);
  const stops=it.map, cs=contacts(it), callable=cs.filter(c=>c.t);

// ---------- Acțiuni: se aplică imediat pe ecran, apoi se trimit la script ca să le vadă toți ----------
// Aceeași logică ca în doPost din script, ca ecranul să arate rezultatul fără să aștepte răspunsul.
function aplicaLocal(it,actiune,valoare){
  const toate=state.data.statusuri=state.data.statusuri||{};
  const zi=toate[it.dayId]=toate[it.dayId]||{};
  const s=zi[it.id]=zi[it.id]||{plus:[],minus:[]};
  s.plus=s.plus||[];s.minus=s.minus||[];
  const eu=state.me,ora=now(),pune=(l,x)=>{if(!l.includes(x))l.push(x)},scoate=(l,x)=>{const i=l.indexOf(x);if(i>=0)l.splice(i,1)};
  if(actiune==="iau"){pune(s.plus,eu);scoate(s.minus,eu);}
  if(actiune==="renunt"){scoate(s.plus,eu);pune(s.minus,eu);if(s.pornit&&s.pornit.cine===eu)s.pornit=null;}
  if(actiune==="pornit") s.pornit=s.pornit?null:{cine:eu,ora};
  if(actiune==="finalizat"){s.finalizat={cine:eu,ora};if(!s.pornit)s.pornit={cine:eu,ora};}
  if(actiune==="anuleaza") s.finalizat=null;
  if(actiune==="rfr") s.rfr={facut:!!valoare,cine:eu,ora};
  // Programul scris de aplicație: arătăm imediat și în „program” ce se va scrie, până vine confirmarea
  if(docSursa()){
    if(actiune==="finalizat"){it.ok=true;it.r.ok=true;}
    if(actiune==="anuleaza"){it.ok=false;it.r.ok=false;}
    if(actiune==="rfr") it.r.rfr=valoare?"facut":"lipsa";
  }
}
let inZbor=0;
async function postScript(corp,faraSesiune){
  const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign(faraSesiune?{}:{t:state.token},corp))});
  let j;
  try{j=JSON.parse(await r.text());}catch(x){throw new Error("scriptul nu a răspuns corect");}
  if(j.auth&&!faraSesiune){arataLogin(j.eroare);}
  if(j.eroare) throw new Error(j.eroare);
  return j;
}
async function trimite(it,actiune,valoare){
  gen++;aplicaLocal(it,actiune,valoare);render();reimprospateazaDetaliu(it.id);
  inZbor++;
  let j;
  try{
    j=await postScript({zi:it.dayId,id:it.id,actiune,valoare});
  }catch(e){
    toast("Nu s-a salvat: "+(e.message&&!/fetch|network|load/i.test(e.message)?e.message:"fără semnal")+". Încearcă din nou.");
    inZbor--;gen++;await incarca(true,true);return;
  }
  inZbor--;
  if(j.scris){ // scris în program: cerem programul nou (gata la script) — statusurile și programul vin împreună
    toast("✓ În program: "+j.document);
    if(inZbor===0) await incarca(true,true);
    return;
  }
  if(inZbor===0){state.data.statusuri[j.zi]=j.statusuri;if(j.v)state.data.v=null;store.set("po.data",state.data);}
  if(j.document) toast("Program: "+j.document);
  render();reimprospateazaDetaliu(it.id);
  if(inZbor===0) incarca(true,true);
}

function finishFromCard(id){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  trimite(it,"finalizat");
  toast(`${it.plate||"Intervenția"} finalizată`,()=>trimite(it,"anuleaza"));
}
function toggleRfr(id){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const on=!rfrOk(it);
  trimite(it,"rfr",on);
  toast(on?`RFR făcut la ${it.plate||"predare"}`:`RFR anulat la ${it.plate||"predare"}`);
}

// ---------- Intrarea în cont ----------
function seteazaSesiune(j){
  Object.assign(state,{token:j.token,me:j.cine,rol:j.rol,user:j.user});
  store.set("po.token",j.token);store.set("po.me",j.cine);store.set("po.rol",j.rol);store.set("po.user",j.user);
  $("#meBtn").textContent=initiale(j.cine);
}
function arataLogin(msg){
  $("#picker").hidden=true;$("#sheet").classList.remove("open");
  $("#setup").hidden=false;
  let mod="login";
  const deseneaza=()=>{
    document.querySelectorAll("#setupMod button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mod));
    const act=mod==="activare";
    $("#lblCod").hidden=!act;$("#lblParola2").hidden=!act;
    $("#fParola").autocomplete=act?"new-password":"current-password";
    $("#setupText").textContent=act?"Ai primit un cod de la Bogdan. Alege-ți un utilizator (de exemplu numele tău) și o parolă de cel puțin 6 caractere."
      :"Intră cu utilizatorul și parola ta. Rămâi logat pe acest telefon.";
    $("#setupGo").textContent=act?"Activează contul":"Intră";
  };
  deseneaza();
  document.querySelectorAll("#setupMod button").forEach(b=>b.onclick=()=>{mod=b.dataset.m;$("#setupErr").hidden=true;deseneaza();});
  $("#setupErr").hidden=!msg;$("#setupErr").textContent=msg||"";
  $("#setupForm").onsubmit=async e=>{
    e.preventDefault();
    const err=t=>{$("#setupErr").hidden=false;$("#setupErr").textContent=t;};
    const user=$("#fUser").value.trim(),parola=$("#fParola").value;
    if(!user||!parola) return err("Completează utilizatorul și parola.");
    if(mod==="activare"){
      if(!$("#fCod").value.trim()) return err("Introdu codul de activare.");
      if(parola!==$("#fParola2").value) return err("Parolele nu sunt la fel.");
    }
    $("#setupGo").textContent="Verific…";
    try{
      const j=await postScript(mod==="login"?{actiune:"login",user,parola}:{actiune:"activare",cod:$("#fCod").value,user,parola},true);
      seteazaSesiune(j);
      $("#fParola").value="";$("#fParola2").value="";$("#fCod").value="";
      $("#setup").hidden=true;state.data=null;
      await incarca();pornesteSemnal();setTimeout(()=>reaboneaza(true),1500);
    }catch(x){
      err(x.message&&!/fetch|network|load/i.test(x.message)?x.message:"Nu mă pot conecta. Verifică semnalul.");
    }finally{deseneaza();}
  };
}

// ---------- Evenimente ----------
document.querySelectorAll(".seg button").forEach(b=>{
  b.setAttribute("aria-pressed",b.dataset.f===state.filter);
  b.onclick=()=>{state.filter=b.dataset.f;store.set("po.filter",state.filter);document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();};
});
$("#days").onclick=e=>{const b=e.target.closest("[data-id],[data-all]");if(!b)return;if(b.dataset.all){cereTot();return;}if(vreauTot())state.totPana=Date.now()+10*60000;state.day=b.dataset.id;renderDays();render();$("#list").scrollTop=0;};
$("#list").onclick=e=>{
  const t=e.target.closest("[data-take]");if(t){takeFromCard(t.dataset.take);return;}
  const f=e.target.closest("[data-finish]");if(f){finishFromCard(f.dataset.finish);return;}
  const r=e.target.closest("[data-rfr]");if(r){toggleRfr(r.dataset.rfr);return;}
  const c=e.target.closest(".card[data-id]");if(c)openDetail(c.dataset.id);
};
$("#q").addEventListener("input",e=>{state.q=e.target.value;$("#qClear").hidden=!state.q;if(state.q.trim())cereTot();render();});
$("#qClear").onclick=()=>{state.q="";$("#q").value="";$("#qClear").hidden=true;render();};
$("#refresh").onclick=()=>incarca(true);
$("#subsol").textContent=DREPTURI;
// Fundalul stă pe loc: se derulează doar lista, detaliile și ferestrele; restul ecranului nu „trage” pagina.
const DERULABILE=".list,.sheet-body,.setup,.picker,.picker-card,.info-date,.days";
document.addEventListener("touchmove",e=>{
  const z=e.target.closest(DERULABILE);
  if(!z||(z.scrollHeight<=z.clientHeight+1&&z.scrollWidth<=z.clientWidth+1))e.preventDefault();
},{passive:false});
$("#meBtn").onclick=meniuCont;

// ---------- Notificări ----------
// Pe iPhone merg doar din aplicația instalată pe ecranul principal (iOS 16.4+), iar permisiunea se cere la o atingere.
const areFirebase=()=>!!(FIREBASE.apiKey&&FIREBASE.vapidKey);
const instalata=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const eIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);
const suportaNotif=()=>"Notification" in window&&"serviceWorker" in navigator&&"PushManager" in window;
const notifActive=()=>suportaNotif()&&Notification.permission==="granted"&&!!store.get("po.push",null);
function stareClopotel(){
  const b=$("#bell");b.hidden=!areFirebase();
  b.classList.toggle("on",notifActive());b.classList.toggle("off",!notifActive());
}
function incarcaScript(src){return new Promise((ok,nu)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>nu(new Error("nu pot încărca "+src));document.head.appendChild(s);});}
let fbGata=null;
function firebaseMessaging(){
  if(!fbGata) fbGata=(async()=>{
    const v="https://www.gstatic.com/firebasejs/10.14.1/";
    await incarcaScript(v+"firebase-app-compat.js");await incarcaScript(v+"firebase-messaging-compat.js");
    const {vapidKey,...cfg}=FIREBASE;firebase.initializeApp(cfg);return firebase.messaging();
  })();
  return fbGata;
}
async function abonare(){
  const m=await firebaseMessaging(),reg=await navigator.serviceWorker.ready;
  const token=await m.getToken({vapidKey:FIREBASE.vapidKey,serviceWorkerRegistration:reg});
  if(!token) throw new Error("telefonul nu a dat un cod de notificări");
  await postScript({actiune:"abonare",valoare:token});
  store.set("po.push",{token,cine:state.me,la:Date.now()});
}
async function activeazaNotificari(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Notificările nu au fost permise.");arataNotificari();return;}
    $("#picker").hidden=true;toast("Activez notificările…");
    await abonare();stareClopotel();toast("Notificări active pentru "+numeAfisat(state.me));
  }catch(e){toast("Nu am putut activa notificările: "+e.message);}
}
// Codul de notificări se mai schimbă; îl retrimitem o dată pe zi și când se schimbă colegul.
async function reaboneaza(fortat){
  const p=store.get("po.push",null);
  if(!areFirebase()||!p||!suportaNotif()||Notification.permission!=="granted") return;
  if(!fortat&&p.cine===state.me&&Date.now()-p.la<864e5) return;
  try{await abonare();stareClopotel();}catch(e){}
}
function arataNotificari(){
  const p=$("#picker");let corp;
  if(!suportaNotif()||(eIOS()&&!instalata()))
    corp=`<div class="picker-text">Pe iPhone, notificările merg doar din aplicația instalată: în Safari apasă <b>Partajează → Adaugă pe ecranul principal</b>, apoi deschide aplicația de pe ecran.</div>`;
  else if(Notification.permission==="denied")
    corp=`<div class="picker-text">Notificările sunt blocate pentru aplicație. Deschide <b>Setări → Notificări → Program</b> și permite-le.</div>`;
  else if(notifActive())
    corp=`<div class="picker-text">Notificările sunt <b>active</b> pe acest telefon pentru <b>${esc(numeAfisat(state.me))}</b>. Primești una când numele tău apare pe un rând din program.</div>
      <button class="picker-row" type="button" id="notifTest"><span><b>Trimite-mi o notificare de test</b></span></button>`;
  else
    corp=`<div class="picker-text">Primești o notificare când operaționalul te trece pe un rând din program, pentru azi, mâine sau poimâine.</div>
      <button class="take" type="button" id="notifOn">Activează notificările</button>`;
  p.innerHTML=`<div class="picker-card" role="dialog" aria-label="Notificări"><div class="picker-title">Notificări</div>${corp}
    <button class="picker-cancel" type="button">Închide</button></div>`;
  p.hidden=false;
  const on=$("#notifOn");if(on)on.onclick=activeazaNotificari;
  const t=$("#notifTest");if(t)t.onclick=async()=>{p.hidden=true;try{await postScript({actiune:"test"});toast("Notificarea de test a plecat. Ar trebui să apară în câteva secunde.");}catch(e){toast("Nu a mers: "+e.message);}};
  p.querySelector(".picker-cancel").onclick=()=>p.hidden=true;
  p.onclick=e=>{if(e.target===p)p.hidden=true;};
}
$("#bell").onclick=arataNotificari;

// Atingerea unei notificări deschide aplicația cu #i=<intervenția>
function citesteLink(){
  const m=/[#&]i=([^&]+)/.exec(location.hash);
  if(m){state.deschide=decodeURIComponent(m[1]);history.replaceState(null,"",location.pathname);}
}
function deschideDinLink(){
  if(!state.deschide) return;
  const it=ITEMS.find(x=>x.id===state.deschide);
  if(!it){ if(state.data&&state.data.doarAziMaine) cereTot(); else state.deschide=null; return; }
  state.deschide=null;state.day=it.dayId;state.filter="all";
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f==="all"));
  renderDays();render();openDetail(it.id);
}
window.addEventListener("hashchange",()=>{citesteLink();deschideDinLink();});
// Semnalul în timp real (Firebase Realtime Database): scriptul anunță „s-a schimbat” (fără date) și cerem imediat.
// Conexiunea stă deschisă doar cât aplicația e pe ecran; verificarea la 5 s rămâne ca plasă de siguranță.
const URL_SEMNAL="https://program-oradea-default-rtdb.europe-west1.firebasedatabase.app/semnal.json";
let semnal=null;
function pornesteSemnal(){
  if(semnal||!state.token||!window.EventSource||document.hidden) return;
  try{
    semnal=new EventSource(URL_SEMNAL);
    const primit=e=>{try{const d=JSON.parse(e.data),v=d&&d.data&&d.data.v;if(v&&(!state.data||v!==state.data.v))incarca(true,true);}catch(x){}};
    semnal.addEventListener("put",primit);semnal.addEventListener("patch",primit);
  }catch(e){semnal=null;}
}
function opresteSemnal(){if(semnal){semnal.close();semnal=null;}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)opresteSemnal();else{pornesteSemnal();incarca();}});
setInterval(()=>{if(!document.hidden)incarca();},5000);
setInterval(subtitlu,30000);

// Pornire. Cheia se poate da și printr-un link de configurare: ...#k=CHEIA (nu ajunge la server).
try{localStorage.removeItem("po.key")}catch(e){} // cheia comună veche nu se mai folosește
$("#meBtn").textContent=initiale(state.me);
citesteLink();
pregateste();renderDays();render();deschideDinLink();
stareClopotel();
if(!state.token) arataLogin(); else {incarca();pornesteSemnal();setTimeout(()=>reaboneaza(false),3000);}

// Înălțimea ecranului: pe iPhone, în aplicația instalată pe ecran, iOS raportează uneori un ecran mai scurt
// cu bara de stare (fâșie goală jos). Atunci folosim înălțimea reală a ecranului telefonului.
function potrivesteInaltimea(){
  const instalataPeEcran=navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  const vertical=window.matchMedia("(orientation: portrait)").matches;
  const h=instalataPeEcran&&vertical?Math.max(window.innerHeight,screen.height):window.innerHeight;
  document.documentElement.style.setProperty("--inaltime",h+"px");
  state.ecran=window.innerHeight+"/"+screen.height+(instalataPeEcran?" inst.":"");
  // iOS desenează partea de jos abia după o derulare: o facem noi, de 1 punct, și revenim
  if(h>window.innerHeight) setTimeout(()=>{window.scrollTo(0,1);requestAnimationFrame(()=>window.scrollTo(0,0));},60);
}
potrivesteInaltimea();
window.addEventListener("resize",potrivesteInaltimea);
window.addEventListener("load",()=>setTimeout(potrivesteInaltimea,250));
window.addEventListener("pageshow",()=>setTimeout(potrivesteInaltimea,250));
window.addEventListener("orientationchange",()=>setTimeout(potrivesteInaltimea,300));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)potrivesteInaltimea();});

// Actualizări: la fiecare deschidere aplicația verifică dacă e o versiune nouă și se reîncarcă singură.
// (Pe iPhone, aplicația de pe ecran păstra altfel varianta veche până la câteva ore.)
if("serviceWorker" in navigator){
  let reincarcat=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reincarcat){reincarcat=true;location.reload();}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const verifica=()=>reg.update().catch(()=>{});
    verifica();
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)verifica();});
  }).catch(()=>{});
}
// Buton de urgență: șterge copiile salvate ale aplicației și o reîncarcă (contul și datele rămân)
async function actualizeazaAplicatia(){
  $("#picker").hidden=true;toast("Actualizez aplicația…");
  try{
    if(window.caches) for(const k of await caches.keys()) await caches.delete(k);
    if(navigator.serviceWorker) for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  }catch(e){}
  location.replace(location.pathname+"?v="+Date.now());
}
